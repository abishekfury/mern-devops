name: Build and Push Docker Images

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            abishek0924/mern-tasks-backend:latest
            abishek0924/mern-tasks-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            abishek0924/mern-tasks-frontend:latest
            abishek0924/mern-tasks-frontend:${{ github.sha }}

      - name: Get temporary AWS access (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::460351657682:role/github-deploy-role
          aws-region: ap-south-1

      - name: Deploy to EC2 using SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids i-01a37cb886eb0be65 \
            --parameters 'commands=["cd /home/ubuntu/app","docker compose pull","docker compose up -d","docker image prune -f"]' \
            --query "Command.CommandId" --output text)
          echo "Command ID: $CMD_ID"
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id i-01a37cb886eb0be65
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id i-01a37cb886eb0be65 \
            --query "StandardOutputContent" --output text